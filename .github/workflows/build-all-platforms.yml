name: Build OpenDRT All Platforms

# Verify only: builds and checks the macOS, Linux and Windows bundles and
# uploads them as workflow artifacts. It does not create a GitHub release and
# does not publish anything.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos:
    uses: ./.github/workflows/build-macos.yml

  build-linux-cuda:
    uses: ./.github/workflows/build-linux-cuda.yml

  build-windows-cuda:
    uses: ./.github/workflows/build-windows-cuda.yml
